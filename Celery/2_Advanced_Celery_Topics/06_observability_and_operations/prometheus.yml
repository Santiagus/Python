global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "fastapi_ingestion_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8010"]

  - job_name: "sanctions_api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["sanctions_api:8015"]
