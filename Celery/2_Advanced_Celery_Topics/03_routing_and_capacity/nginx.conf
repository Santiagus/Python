events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Performance & low-latency TCP optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    client_max_body_size 20M;

    # =========================================================================
    # The Golden Architecture: Ingestion SLA Upstream Pools
    # =========================================================================

    # 1. Real-Time Instant Payment Ingestion Pool (Sub-25ms SLA, lean memory, zero batch parsing)
    upstream instant_backend {
        least_conn;
        server api_instant:8000;
        keepalive 64;
    }

    # 2. High-Throughput Bulk Batch Disbursement Ingestion Pool (Corporate payroll uploads & chunking)
    upstream batch_backend {
        least_conn;
        server api_batch:8000;
        keepalive 64;
    }

    server {
        listen 8010;
        server_name _;

        # Access & error logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # ---------------------------------------------------------------------
        # Route 1: Real-Time Instant Rails (FedNow / RTP) -> api_instant pool
        # ---------------------------------------------------------------------
        location /payments/instant {
            proxy_pass http://instant_backend;
            proxy_http_version 1.1;

            # Clear Connection header for persistent keep-alive upstream pooling
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upstream observability headers for empirical balancing verification
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Response-Time $upstream_response_time always;

            # Low-latency response buffering
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # Route 2: Bulk Corporate Payroll Disbursements (ACH) -> api_batch pool
        # ---------------------------------------------------------------------
        location /disbursements/batch {
            proxy_pass http://batch_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Response-Time $upstream_response_time always;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ---------------------------------------------------------------------
        # Route 3: Operational & Management Endpoints (Health, Docs, Metrics) -> api_instant
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://instant_backend;
            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Response-Time $upstream_response_time always;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
