events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Performance & low-latency TCP optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    client_max_body_size 20M;

    # Dynamic capacity-aware load balancing based on active in-flight requests
    upstream api_backend {
        least_conn;
        server api:8000;
        keepalive 64;
    }

    server {
        listen 8010;
        server_name _;

        # Access & error logs
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # Clear Connection header for persistent keep-alive upstream pooling
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Upstream observability headers for empirical balancing verification
            add_header X-Upstream-Addr $upstream_addr always;
            add_header X-Upstream-Response-Time $upstream_response_time always;

            # Low-latency response buffering
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}

