[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501", # line length handled by formatter / docstrings
    "E402", # module level import not at top of file
]

[tool.ruff.lint.isort]
known-first-party = ["app", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "unit: Isolated in-memory unit tests",
    "integration: Database, Celery, and Redis integration tests",
    "e2e: Live multi-process end-to-end tests",
    "contract: AMQP and worker contract tests",
]

